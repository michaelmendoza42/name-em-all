server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite's hashed bundles never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Artwork and silhouettes keep stable names (one per dex number) and only
  # change when the dataset is regenerated, so cache them for a week.
  location ~ ^/(art|sil)/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The page and dataset must revalidate so a redeploy shows up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /lookalikes.json {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /pokedex.json {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
